# python -m bytelatent.stool_ccdb launcher=bash ngpu=1 ncpu=1 mem=64G time=800 nodes=1 gpu_type=l40s script=bytelatent.train config=[bytelatent/configs/toklens/data_optimal_50M.yaml]

dump_dir: /fsx/craffel/lingua_logs/data_optimal_tok_T4
name: "data_optimal_tok_T4"  # change T value per run: T2, T3, T4, T5, T6, T8

steps: 250_000   # upper bound; monitor BPB for convergence
probe_freq: null
seed: 777

optim:
  lr: 4e-4
  warmup: 2000
  lr_min_ratio: 0.1
  clip: 1.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  # --- 50M global transformer ---
  n_heads: 8
  dim: 512          # global transformer hidden dim
  n_layers: 8       # !!!FILL THIS IN — not in your template, check Lingua's default or paper Table S1

  # --- BLT tokenization: SWEEP THIS ---
  vocab_size: 260
  patch_size: 4     # controls T directly; sweep: 2, 3, 4, 5, 6, 8
  patching_mode: "space"

  # --- local encoder/decoder: keep fixed across runs ---
  dim_token: 256
  dim_local_encoder: 256
  dim_local_decoder: 256
  tie_local_encoder_decoder_logits: false
  patch_in_forward: false
  use_local_encoder_transformer: true

  # --- cross attention ---
  cross_attn_encoder: true
  cross_attn_decoder: true
  cross_attn_window_encoder: 512
  cross_attn_window_decoder: 512
  cross_attn_k: 8
  cross_attn_nheads: 4
  cross_attn_all_layers_decoder: true
  cross_attn_all_layers_encoder: true
  cross_attn_use_flex_attention: true
  cross_attn_init_by_pooling: true

  # --- hash byte groups ---
  encoder_hash_byte_group_size: [4]
  encoder_hash_byte_group_vocab: 50002
  encoder_hash_byte_group_nb_functions: 3
  encoder_enable_byte_ngrams: false

  max_encoder_seq_length: 12288
  pad_to_max_length: true
  patching_threshold: 3.1439168453216553  # keep fixed; this is entropy-based patching threshold
  log_patch_lengths: true

  non_linearity: "swiglu"
  use_rope: true
  attn_impl: "xformers"
  attn_bias_type: "block_causal"
  local_attention_window_len: 512
  max_seqlen: 12288
  max_length: 256
  downsampling_by_pooling: "max"

  recompute_fc1_out: false
  recompute_fc3_out: false
  recompute_attn: false
  custom_bwd: false
  layer_ckpt: "none"
  init_use_gaussian: true
  init_use_depth: "current"
  alpha_depth: "disabled"

data:
  root_dir: /scratch/gsa/data/dclm/dclm_baseline_1.0_40bt/
  sources:
    dclm_baseline_1.0_40bt: 1.0
  batch_size: 8         # increase from 2; 50M model can handle it
  prefetch_size: 256
  seq_len: 4096
  load_async: true
  # preprocess_dir: ???
  tokenizer_args:
    name: blt
    # init_kwargs:
    #   bpe_tokenizer_path: ???  # BLT still needs a BPE tokenizer for fallback

profiling:
  run: false

checkpoint:
  dump:
    every: 5000
    keep: 5
  eval:
    every: 2500   # frequent enough to track BPB convergence curve
    keep: -1      # keep all — you need the full BPB curve per run

logging:
  freq: 10

eval_on_gpus: 8
eval: null